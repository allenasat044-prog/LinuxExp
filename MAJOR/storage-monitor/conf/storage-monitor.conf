# ============================================================
# Storage Monitor - Configuration File
# ============================================================

# --- Thresholds (percentage) ---
DISK_WARN_THRESHOLD=75
DISK_CRIT_THRESHOLD=90

INODE_WARN_THRESHOLD=75
INODE_CRIT_THRESHOLD=90

# Growth threshold: alert if a monitored path grows by more than
# this many MB between two consecutive snapshots
GROWTH_ALERT_MB=500

# --- Paths to monitor for inode/disk usage (mount points) ---
# Leave empty to auto-detect all local mounted filesystems
MONITORED_MOUNTS=""

# --- Paths to monitor for storage growth tracking ---
# (directories whose size is snapshotted over time)
MONITORED_DIRS=("/var/log" "/home" "/tmp")

# --- Data / logging locations ---
# PROJECT_ROOT is set automatically by lib/common.sh before this file is
# sourced, so these paths always point at wherever the toolkit is actually
# installed (e.g. /opt/storage-monitor) rather than a hardcoded location.
DATA_DIR="${PROJECT_ROOT}/data"
LOG_DIR="${PROJECT_ROOT}/logs"
REPORT_DIR="${PROJECT_ROOT}/reports"
SNAPSHOT_FILE="${DATA_DIR}/growth_snapshots.csv"
LOG_FILE="${LOG_DIR}/storage-monitor.log"

# --- Alerting ---
# Enable/disable alert channels: true/false
ALERT_EMAIL_ENABLED=false
ALERT_EMAIL_TO="admin@example.com"
ALERT_EMAIL_FROM="storage-monitor@$(hostname)"

ALERT_WEBHOOK_ENABLED=false
ALERT_WEBHOOK_URL="https://hooks.slack.com/services/XXX/YYY/ZZZ"

ALERT_SYSLOG_ENABLED=true

# How many days of snapshot history to retain
SNAPSHOT_RETENTION_DAYS=90
